[package]
name = "vole-video"
version = "0.7.0"
edition = "2021"
rust-version = "1.98"
description = "VOLE — Video Object Layer Engine. Deterministic procedural video storage, transport, inverse proceduralization and materialization."
license = "MIT OR Apache-2.0"
repository = "https://github.com/infinityabundance/vole"
readme = "README.md"
keywords = ["video", "procedural", "state", "materialization", "compression"]
categories = ["multimedia::video", "compression"]
autobins = false

# The one CLI binary is `vole`.
[[bin]]
name = "vole"
path = "src/main.rs"

# VOLE is one, self-contained, native Rust crate. It owns its normative wire
# format and materializer and violates no-unsafe for now. It does NOT depend on
# DSFB or EntropyFS for normative decode; those remain conceptually separate and
# are out-of-crate concerns.
[dependencies]
blake3 = "1"

# dev-dependencies: test-only oracle for byte parity courts. The normative
# coder is owned in-crate (src/rans.rs); ryg-rans-rs is never linked into
# normative decode and is not a runtime dependency.
[dev-dependencies]
ryg-rans-rs = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
